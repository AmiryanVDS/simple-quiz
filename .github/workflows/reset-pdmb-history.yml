name: Reset PDMB poll history

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/reset-pdmb-history.yml

jobs:
  reset:
    runs-on: ubuntu-latest
    env:
      SERVER_HOST: 89.124.83.34
    steps:
      - name: Configure SSH
        env:
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_PORT: ${{ vars.SERVER_PORT }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$SERVER_PORT" -H "$SERVER_HOST" >> ~/.ssh/known_hosts

      - name: Clear old polls, reminders and summaries
        env:
          SERVER_USER: ${{ vars.SERVER_USER }}
          SERVER_PORT: ${{ vars.SERVER_PORT }}
        run: |
          ssh -p "$SERVER_PORT" "$SERVER_USER@$SERVER_HOST" 'python3 -' <<'PY'
          import json
          from pathlib import Path

          path = Path("/opt/pdmb-bot/state/weekly_poll_state.json")
          old = {}
          if path.exists():
              try:
                  old = json.loads(path.read_text(encoding="utf-8"))
              except Exception:
                  old = {}

          fresh = {
              "polls": {},
              "last_schedule_date": None,
              "last_poll_date": None,
              "sent_game_reminders": {},
              "sent_game_summaries": {},
              "team_users": old.get("team_users", {}),
          }
          tmp = path.with_suffix(".json.tmp")
          tmp.write_text(json.dumps(fresh, ensure_ascii=False, indent=2), encoding="utf-8")
          tmp.replace(path)
          print("PDMB poll history reset; team_users preserved")
          PY
          ssh -p "$SERVER_PORT" "$SERVER_USER@$SERVER_HOST" '
            sudo chown pdmb:pdmb /opt/pdmb-bot/state/weekly_poll_state.json
            sudo systemctl restart pdmb-bot
            sleep 3
            systemctl is-active pdmb-bot
          '
