name: Deploy training to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - Simple_Quiz_Team_Training.html
      - outputs/Simple_Quiz_Team_Training.html
      - .github/workflows/deploy-training-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare static site
        run: |
          mkdir -p site
          cp Simple_Quiz_Team_Training.html site/index.html
          cp Simple_Quiz_Team_Training.html site/Simple_Quiz_Team_Training.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
