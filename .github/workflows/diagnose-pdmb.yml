name: Diagnose PDMB bot

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/diagnose-pdmb.yml
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        env:
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_HOST: ${{ vars.SERVER_HOST }}
          SERVER_PORT: ${{ vars.SERVER_PORT }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$SERVER_PORT" -H "$SERVER_HOST" >> ~/.ssh/known_hosts
      - name: Show bot status and recent logs
        env:
          SERVER_HOST: ${{ vars.SERVER_HOST }}
          SERVER_USER: ${{ vars.SERVER_USER }}
          SERVER_PORT: ${{ vars.SERVER_PORT }}
        run: |
          ssh -p "$SERVER_PORT" "$SERVER_USER@$SERVER_HOST" '
            echo "===== status ====="
            systemctl status pdmb-bot --no-pager || true
            echo "===== state ====="
            ls -la /opt/pdmb-bot/state || true
            cat /opt/pdmb-bot/state/weekly_poll_state.json 2>/dev/null || true
            echo "===== journal ====="
            journalctl -u pdmb-bot --since "10 minutes ago" --no-pager -n 250
          '
