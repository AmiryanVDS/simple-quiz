name: Deploy PDMB bot

on:
  push:
    branches: [main]
    paths:
      - pdmb_bot/**
      - deploy/pdmb-bot.service
      - .github/workflows/deploy-pdmb-bot.yml
  workflow_dispatch:

concurrency:
  group: pdmb-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare private team IDs
        env:
          PDMB_TEAM_IDS_JSON: ${{ secrets.PDMB_TEAM_IDS_JSON }}
        run: |
          if [ -n "$PDMB_TEAM_IDS_JSON" ]; then
            python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          from pdmb_bot.team_members import apply_private_ids

          roster = json.loads(Path('pdmb_bot/team_roster.json').read_text(encoding='utf-8'))
          private_ids = json.loads(os.environ['PDMB_TEAM_IDS_JSON'])
          apply_private_ids(roster, private_ids)
          destination = Path('/tmp/pdmb-team-ids.json')
          destination.write_text(json.dumps(private_ids, ensure_ascii=False), encoding='utf-8')
          destination.chmod(0o600)
          print('Private team IDs validated')
          PY
          fi
      - name: Configure SSH
        env:
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_HOST: ${{ vars.SERVER_HOST }}
          SERVER_PORT: ${{ vars.SERVER_PORT }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$SERVER_PORT" -H "$SERVER_HOST" >> ~/.ssh/known_hosts
      - name: Upload bot
        env:
          SERVER_HOST: ${{ vars.SERVER_HOST }}
          SERVER_USER: ${{ vars.SERVER_USER }}
          SERVER_PORT: ${{ vars.SERVER_PORT }}
        run: |
          tar -C pdmb_bot -czf /tmp/pdmb-bot.tgz .
          scp -P "$SERVER_PORT" /tmp/pdmb-bot.tgz "$SERVER_USER@$SERVER_HOST:/tmp/pdmb-bot.tgz"
          if [ -f /tmp/pdmb-team-ids.json ]; then
            scp -P "$SERVER_PORT" /tmp/pdmb-team-ids.json "$SERVER_USER@$SERVER_HOST:/tmp/pdmb-team-ids.json"
          fi
      - name: Install and restart
        env:
          SERVER_HOST: ${{ vars.SERVER_HOST }}
          SERVER_USER: ${{ vars.SERVER_USER }}
          SERVER_PORT: ${{ vars.SERVER_PORT }}
        run: |
          ssh -p "$SERVER_PORT" "$SERVER_USER@$SERVER_HOST" '
            set -e
            sudo systemctl stop pdmb-bot
            install -d /opt/pdmb-bot/current
            install -d -o pdmb -g pdmb /opt/pdmb-bot/state
            if [ -f /tmp/pdmb-team-ids.json ]; then
              sudo install -o pdmb -g pdmb -m 600 /tmp/pdmb-team-ids.json /opt/pdmb-bot/state/private_team_ids.json
              rm -f /tmp/pdmb-team-ids.json
            fi
            find /opt/pdmb-bot/current -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +
            tar -xzf /tmp/pdmb-bot.tgz -C /opt/pdmb-bot/current
            /opt/pdmb-bot/venv/bin/pip install -r /opt/pdmb-bot/current/requirements.txt
            sudo systemctl start pdmb-bot
            sudo systemctl is-active --quiet pdmb-bot
            sleep 25
            echo "===== pdmb-bot journal ====="
            journalctl -u pdmb-bot --since "2 minutes ago" --no-pager -n 120
          '
