name: Deploy PDMB bot

on:
  push:
    branches: [main]
    paths:
      - pdmb_bot/**
      - deploy/pdmb-bot.service
      - .github/workflows/deploy-pdmb-bot.yml
  workflow_dispatch:
    inputs:
      send_schedule:
        description: Send the filtered schedule to the team chat after deployment
        required: false
        type: boolean
        default: false
      send_poll:
        description: Send a poll for games not yet polled this week
        required: false
        type: boolean
        default: false

concurrency:
  group: pdmb-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SERVER_HOST: 89.124.83.34
    steps:
      - uses: actions/checkout@v4
      - name: Prepare private team IDs
        env:
          PDMB_TEAM_IDS_JSON: ${{ secrets.PDMB_TEAM_IDS_JSON }}
          PDMB_EXTRA_TEAM_IDS_JSON: ${{ secrets.PDMB_EXTRA_TEAM_IDS_JSON }}
        run: |
          if [ -n "$PDMB_TEAM_IDS_JSON" ] || [ -n "$PDMB_EXTRA_TEAM_IDS_JSON" ]; then
            python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          from pdmb_bot.team_members import apply_private_ids

          roster = json.loads(Path('pdmb_bot/team_roster.json').read_text(encoding='utf-8'))
          private_ids = json.loads(os.environ.get('PDMB_TEAM_IDS_JSON') or '{}')
          extra_ids = json.loads(os.environ.get('PDMB_EXTRA_TEAM_IDS_JSON') or '{}')
          if set(private_ids) & set(extra_ids):
              raise ValueError('Team ID secret entries overlap')
          private_ids.update(extra_ids)
          apply_private_ids(roster, private_ids)
          destination = Path('/tmp/pdmb-team-ids.json')
          destination.write_text(json.dumps(private_ids, ensure_ascii=False), encoding='utf-8')
          destination.chmod(0o600)
          print('Private team IDs validated')
          PY
          fi
      - name: Configure SSH
        env:
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_PORT: ${{ vars.SERVER_PORT }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$SERVER_PORT" -H "$SERVER_HOST" >> ~/.ssh/known_hosts
      - name: Upload bot
        env:
          SERVER_USER: ${{ vars.SERVER_USER }}
          SERVER_PORT: ${{ vars.SERVER_PORT }}
        run: |
          tar -C pdmb_bot -czf /tmp/pdmb-bot.tgz .
          scp -P "$SERVER_PORT" /tmp/pdmb-bot.tgz "$SERVER_USER@$SERVER_HOST:/tmp/pdmb-bot.tgz"
          if [ -f /tmp/pdmb-team-ids.json ]; then
            scp -P "$SERVER_PORT" /tmp/pdmb-team-ids.json "$SERVER_USER@$SERVER_HOST:/tmp/pdmb-team-ids.json"
          fi
      - name: Install and restart
        env:
          SERVER_USER: ${{ vars.SERVER_USER }}
          SERVER_PORT: ${{ vars.SERVER_PORT }}
        run: |
          ssh -p "$SERVER_PORT" "$SERVER_USER@$SERVER_HOST" '
            set -e
            trap "sudo systemctl start pdmb-bot || true" EXIT
            install -d /opt/pdmb-bot/current
            install -d -o pdmb -g pdmb /opt/pdmb-bot/state
            if [ -f /tmp/pdmb-team-ids.json ]; then
              sudo install -o pdmb -g pdmb -m 600 /tmp/pdmb-team-ids.json /opt/pdmb-bot/state/private_team_ids.json
              rm -f /tmp/pdmb-team-ids.json
            fi
            sudo chown -R pdmb:pdmb /opt/pdmb-bot/state
            find /opt/pdmb-bot/current -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +
            tar -xzf /tmp/pdmb-bot.tgz -C /opt/pdmb-bot/current
            if ! /opt/pdmb-bot/venv/bin/python -m pip --version >/dev/null 2>&1; then
              /opt/pdmb-bot/venv/bin/python -m ensurepip --upgrade
            fi
            /opt/pdmb-bot/venv/bin/python -m pip install -r /opt/pdmb-bot/current/requirements.txt
            sudo systemctl restart pdmb-bot
            sudo systemctl is-active --quiet pdmb-bot
            trap - EXIT
            sleep 25
            echo "===== pdmb-bot journal ====="
            journalctl -u pdmb-bot --since "2 minutes ago" --no-pager -n 120
          '
      - name: Send schedule on request
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.send_schedule }}
        env:
          SERVER_USER: ${{ vars.SERVER_USER }}
          SERVER_PORT: ${{ vars.SERVER_PORT }}
        run: |
          ssh -p "$SERVER_PORT" "$SERVER_USER@$SERVER_HOST" 'cd /opt/pdmb-bot/current && /opt/pdmb-bot/venv/bin/python -' <<'PY'
          import asyncio
          import os
          import pwd
          from dotenv import load_dotenv

          load_dotenv('/etc/pdmb-bot.env')
          user = pwd.getpwnam('pdmb')
          os.setgroups([])
          os.setgid(user.pw_gid)
          os.setuid(user.pw_uid)
          import bot as pdmb

          async def main():
              try:
                  events = await pdmb.send_quiz_schedule(chat_id=pdmb.CHAT_ID)
                  print(f'Sent filtered schedule with {len(events)} events')
              finally:
                  await pdmb.bot.session.close()

          asyncio.run(main())
          PY
      - name: Send poll on request
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.send_poll }}
        env:
          SERVER_USER: ${{ vars.SERVER_USER }}
          SERVER_PORT: ${{ vars.SERVER_PORT }}
        run: |
          ssh -p "$SERVER_PORT" "$SERVER_USER@$SERVER_HOST" 'cd /opt/pdmb-bot/current && /opt/pdmb-bot/venv/bin/python -' <<'PY'
          import asyncio
          import os
          import pwd
          from dotenv import load_dotenv

          load_dotenv('/etc/pdmb-bot.env')
          user = pwd.getpwnam('pdmb')
          os.setgroups([])
          os.setgid(user.pw_gid)
          os.setuid(user.pw_uid)
          import bot as pdmb

          async def main():
              try:
                  events = await asyncio.to_thread(pdmb.fetch_quiz_events)
                  created = await pdmb.send_weekly_poll(events, chat_id=pdmb.CHAT_ID)
                  print('Poll sent' if created else 'No unpolled games in the current week')
              finally:
                  await pdmb.bot.session.close()

          asyncio.run(main())
          PY
